# Headers de segurança do conteúdo estático.
#
# Vive num arquivo à parte por causa de uma regra traiçoeira do nginx: um
# `add_header` (ou `expires`, que usa o mesmo mecanismo interno) dentro de um
# `location` DESCARTA todos os add_header herdados do bloco `server`. Ou
# seja, bastaria uma diretiva de cache num location pra os headers de
# segurança sumirem daquele caminho, silenciosamente. Incluir o mesmo
# arquivo em cada location deixa isso explícito e à prova desse efeito.
#
# Não é incluído em /api/ de propósito: o backend já manda os dele
# (`internal/servidor/middleware.go`, ver `03-backend.md`) — header duplicado
# (ex.: dois X-Frame-Options) faz o navegador descartar os dois.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# CSP de partida — ajuste o allowlist se o projeto carregar algo de terceiro
# além do já previsto. Concessões já embutidas:
#   - 'unsafe-inline' em style-src/style-src-elem: o Radix UI (por trás do
#     shadcn, ver 02-frontend.md) injeta estilo inline pra posicionar
#     dropdown/dialog; sem isso a interface quebra.
#   - fonts.googleapis.com/fonts.gstatic.com: Red Hat Display, a fonte do
#     Design System ARCOM (ver 08-design-system.md). Remova se o projeto
#     trocar de fonte ou passar a servi-la localmente.
#   - data: em img-src: assets embutidos no bundle.
# connect-src 'self' basta enquanto a API for same-origin via proxy — é essa
# decisão que evita CORS (ver 00-visao-geral.md).
#
# HSTS fica FORA daqui de propósito: quem termina TLS é o proxy reverso na
# frente (ver 04-docker-deploy.md), e é lá que ele deve ser definido. Mandar
# HSTS de um serviço que atende em HTTP puro dentro da rede do compose não
# protege nada.
add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' data: https://fonts.gstatic.com; style-src-elem 'self' 'unsafe-inline' https://fonts.googleapis.com; connect-src 'self'" always;
